[project]
name = "autoresearch-astro"
version = "0.1.0"
description = "Autonomous research swarm for streaming crossmatched astronomical surveys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lsdb==0.9.0",
    "hats==0.9.0",
    "nested-pandas>=0.6.8",
    "dask[distributed]>=2025.3.0",
    "huggingface-hub>=0.30.0",
    "pyarrow>=19.0.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "psutil>=6.0.0",
    "matplotlib>=3.10.0",
]
